<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Market shop — row of shops with one open">
  <defs>
    <linearGradient id="sh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B0508"/><stop offset="1" stop-color="#5A090D"/>
    </linearGradient>
    <pattern id="sh-shutter" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#5A090D"/><rect y="9" width="10" height="3" fill="#3A060A"/>
    </pattern>
    <linearGradient id="sh-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D4"/><stop offset="1" stop-color="#ECA72C" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#sh-sky)"/>

  <!-- building -->
  <rect x="0" y="190" width="1000" height="440" fill="#8A0D13"/>
  <rect x="0" y="178" width="1000" height="14" fill="#ECA72C"/>
  <g fill="#FFF3D4" opacity=".16">
    <rect x="40" y="230" width="120" height="80"/><rect x="240" y="230" width="120" height="80"/>
    <rect x="640" y="230" width="120" height="80"/><rect x="840" y="230" width="120" height="80"/>
  </g>
  <rect x="440" y="230" width="120" height="80" fill="url(#sh-in)" opacity=".7"/>
  <rect x="0" y="336" width="1000" height="10" fill="#5A090D"/>

  <!-- sign boards -->
  <g fill="#5A090D">
    <rect x="20" y="370" width="160" height="44" rx="3"/><rect x="220" y="370" width="160" height="44" rx="3"/>
    <rect x="620" y="370" width="160" height="44" rx="3"/><rect x="820" y="370" width="160" height="44" rx="3"/>
  </g>
  <rect x="420" y="370" width="160" height="44" rx="3" fill="#ECA72C"/>
  <rect x="446" y="386" width="108" height="12" rx="6" fill="#4A070B" opacity=".55"/>

  <!-- shutters -->
  <g fill="url(#sh-shutter)">
    <rect x="20" y="440" width="160" height="190"/><rect x="220" y="440" width="160" height="190"/>
    <rect x="620" y="440" width="160" height="190"/><rect x="820" y="440" width="160" height="190"/>
  </g>
  <!-- open shop -->
  <rect x="420" y="440" width="160" height="190" fill="url(#sh-in)"/>
  <g fill="#8A0D13" opacity=".55">
    <rect x="436" y="480" width="128" height="6"/><rect x="436" y="530" width="128" height="6"/><rect x="436" y="580" width="128" height="6"/>
  </g>
  <path d="M404 426h192l-16 30H420Z" fill="#F5C768"/>
  <path d="M404 426h192" stroke="#FFF3D4" stroke-width="3"/>
  <path d="M390 630h220l60 120H330Z" fill="#FFF3D4" opacity=".08"/>

  <!-- pillars -->
  <g fill="#B3111A">
    <rect x="0" y="420" width="20" height="210"/><rect x="190" y="420" width="20" height="210"/><rect x="390" y="420" width="20" height="210"/>
    <rect x="590" y="420" width="20" height="210"/><rect x="790" y="420" width="20" height="210"/><rect x="980" y="420" width="20" height="210"/>
  </g>

  <!-- pavement + road -->
  <rect x="0" y="630" width="1000" height="34" fill="#B3111A"/>
  <rect x="0" y="630" width="1000" height="4" fill="#ECA72C"/>
  <rect x="0" y="664" width="1000" height="86" fill="#2B0508"/>
  <path d="M0 710h1000" stroke="#FFF3D4" stroke-opacity=".14" stroke-width="3" stroke-dasharray="40 30"/>
</svg>
