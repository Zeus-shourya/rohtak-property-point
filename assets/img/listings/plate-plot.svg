<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Residential plot — sector layout plan">
  <defs>
    <pattern id="pp-plots" width="82" height="135" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="78" height="131" fill="#5A090D" stroke="#FFF3D4" stroke-opacity=".22"/>
    </pattern>
    <radialGradient id="pp-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#2B0508" stop-opacity="0"/>
      <stop offset="1" stop-color="#2B0508" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="pp-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ECA72C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ECA72C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="750" fill="#3A060A"/>

  <!-- roads -->
  <rect x="0" y="330" width="1000" height="70" fill="#2B0508"/>
  <rect x="470" y="0" width="60" height="750" fill="#2B0508"/>
  <path d="M0 365h1000" stroke="#FFF3D4" stroke-opacity=".35" stroke-width="3" stroke-dasharray="26 22"/>
  <path d="M500 0v330M500 400v350" stroke="#FFF3D4" stroke-opacity=".25" stroke-width="2" stroke-dasharray="18 18"/>

  <!-- plot blocks -->
  <g transform="translate(40 40)"><rect width="410" height="270" fill="url(#pp-plots)"/></g>
  <g transform="translate(550 40)"><rect width="410" height="270" fill="url(#pp-plots)"/></g>
  <g transform="translate(40 420)"><rect width="410" height="270" fill="url(#pp-plots)"/></g>

  <!-- park -->
  <rect x="552" y="422" width="406" height="266" rx="6" fill="#8A0D13" opacity=".55"/>
  <path d="M560 660C640 560 760 640 830 520S930 450 950 430" fill="none" stroke="#FFF3D4" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
  <g fill="#ECA72C" opacity=".28">
    <circle cx="610" cy="470" r="26"/><circle cx="660" cy="500" r="18"/><circle cx="880" cy="620" r="30"/>
    <circle cx="720" cy="640" r="22"/><circle cx="905" cy="500" r="16"/><circle cx="780" cy="470" r="20"/>
    <circle cx="630" cy="600" r="16"/>
  </g>

  <!-- the plot -->
  <circle cx="755" cy="108" r="150" fill="url(#pp-glow)"/>
  <rect x="716" y="42" width="78" height="131" fill="#ECA72C"/>
  <rect x="716" y="42" width="78" height="131" fill="none" stroke="#FFF3D4" stroke-width="3"/>
  <g stroke="#FFF3D4" stroke-width="2" opacity=".9">
    <path d="M716 26h78M716 19v14M794 19v14"/>
    <path d="M810 42v131M803 42h14M803 173h14"/>
  </g>
  <path fill="#4A070B" fill-rule="evenodd" d="M755 150c-3-5-20-20-20-34a20 20 0 1 1 40 0c0 14-17 29-20 34Z M755 104l11 9h-3v12h-16v-12h-3Z"/>

  <rect width="1000" height="750" fill="url(#pp-vig)"/>
</svg>
