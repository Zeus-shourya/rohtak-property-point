<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Independent floor — S+3 residential building at dusk">
  <defs>
    <linearGradient id="fl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B0508"/><stop offset=".6" stop-color="#5A090D"/><stop offset="1" stop-color="#B3111A"/>
    </linearGradient>
    <linearGradient id="fl-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D4" stop-opacity=".95"/><stop offset="1" stop-color="#F5C768" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#fl-sky)"/>
  <circle cx="820" cy="150" r="170" fill="#ECA72C" opacity=".12"/>
  <circle cx="820" cy="150" r="54" fill="#F5C768" opacity=".35"/>

  <!-- neighbours -->
  <g fill="#3A060A">
    <rect x="30" y="300" width="250" height="340"/><rect x="60" y="272" width="46" height="28" rx="6"/>
    <rect x="720" y="330" width="250" height="310"/><rect x="880" y="302" width="46" height="28" rx="6"/>
  </g>
  <g fill="#FFF3D4" opacity=".14">
    <rect x="60" y="340" width="70" height="50"/><rect x="170" y="440" width="70" height="50"/>
    <rect x="760" y="370" width="70" height="50"/><rect x="860" y="470" width="70" height="50"/>
  </g>
  <rect x="120" y="340" width="70" height="50" fill="url(#fl-win)" opacity=".5"/>

  <!-- the building -->
  <rect x="300" y="220" width="400" height="420" fill="#8A0D13"/>
  <rect x="290" y="212" width="420" height="14" fill="#ECA72C"/>
  <g fill="#ECA72C">
    <rect x="296" y="334" width="408" height="8"/><rect x="296" y="434" width="408" height="8"/><rect x="296" y="534" width="408" height="8"/>
  </g>

  <!-- floors 1–3 -->
  <g id="fl-row">
    <rect x="330" y="248" width="140" height="78" fill="url(#fl-win)"/>
    <path d="M400 248v78M330 287h140" stroke="#8A0D13" stroke-width="4"/>
    <rect x="515" y="250" width="150" height="76" fill="url(#fl-win)" opacity=".8"/>
    <rect x="505" y="298" width="170" height="36" fill="#FFF3D4" opacity=".16"/>
    <path d="M505 298h170" stroke="#ECA72C" stroke-width="3"/>
    <rect x="480" y="236" width="14" height="98" fill="#5A090D"/>
  </g>
  <use href="#fl-row" y="100"/>
  <use href="#fl-row" y="200" opacity=".85"/>

  <!-- stilt parking -->
  <rect x="300" y="542" width="400" height="98" fill="#2B0508"/>
  <g fill="#5A090D"><rect x="300" y="542" width="16" height="98"/><rect x="492" y="542" width="16" height="98"/><rect x="684" y="542" width="16" height="98"/></g>
  <path d="M345 628v-20c0-10 8-16 18-18l20-4 18-18h54l24 20 20 4c8 2 12 8 12 16v20Z" fill="#ECA72C" opacity=".32"/>
  <rect x="540" y="560" width="120" height="68" fill="#FFF3D4" opacity=".1"/>

  <!-- ground -->
  <rect x="0" y="640" width="1000" height="6" fill="#ECA72C"/>
  <rect x="0" y="646" width="1000" height="104" fill="#2B0508"/>
  <path d="M0 700h1000" stroke="#FFF3D4" stroke-opacity=".12" stroke-width="3" stroke-dasharray="40 30"/>
</svg>
