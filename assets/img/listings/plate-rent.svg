<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Floor for rent — balcony with a To Let board">
  <defs>
    <linearGradient id="rn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A060A"/><stop offset="1" stop-color="#B3111A"/>
    </linearGradient>
    <linearGradient id="rn-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D4"/><stop offset="1" stop-color="#F5C768" stop-opacity=".8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#rn-sky)"/>
  <circle cx="160" cy="140" r="160" fill="#ECA72C" opacity=".12"/>

  <!-- facade -->
  <rect x="330" y="0" width="670" height="750" fill="#8A0D13"/>
  <rect x="330" y="0" width="16" height="750" fill="#B3111A"/>

  <!-- upper floor windows -->
  <rect x="410" y="40" width="200" height="120" fill="#5A090D"/>
  <rect x="690" y="40" width="240" height="120" fill="url(#rn-win)" opacity=".55"/>
  <rect x="330" y="196" width="670" height="12" fill="#ECA72C"/>

  <!-- the rental floor: balcony -->
  <rect x="410" y="250" width="520" height="210" fill="#5A090D"/>
  <rect x="440" y="270" width="200" height="190" fill="url(#rn-win)" opacity=".92"/>
  <path d="M540 270v190" stroke="#5A090D" stroke-width="5"/>
  <rect x="690" y="270" width="210" height="130" fill="url(#rn-win)" opacity=".7"/>
  <path d="M760 270v130M830 270v130" stroke="#5A090D" stroke-width="5"/>
  <rect x="370" y="460" width="600" height="16" fill="#ECA72C"/>
  <!-- railing -->
  <rect x="380" y="372" width="580" height="88" fill="#FFF3D4" opacity=".1"/>
  <path d="M380 372h580" stroke="#ECA72C" stroke-width="5"/>
  <g stroke="#ECA72C" stroke-width="2" opacity=".6"><path d="M420 372v88M470 372v88M520 372v88M570 372v88M620 372v88M670 372v88M720 372v88M770 372v88M820 372v88M870 372v88M920 372v88"/></g>

  <!-- To Let board -->
  <path d="M520 374L560 470M740 374L700 470" stroke="#FFF3D4" stroke-width="2.5" opacity=".85"/>
  <g transform="rotate(-2 630 520)">
    <rect x="500" y="468" width="260" height="110" rx="6" fill="#FFF3D4"/>
    <rect x="512" y="480" width="236" height="86" rx="3" fill="none" stroke="#D6151D" stroke-width="3"/>
    <text x="630" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="6" fill="#D6151D">TO LET</text>
  </g>

  <!-- lower floor -->
  <rect x="410" y="560" width="200" height="130" fill="#5A090D"/>
  <rect x="690" y="560" width="240" height="130" fill="#FFF3D4" opacity=".14"/>
  <rect x="330" y="720" width="670" height="30" fill="#3A060A"/>

  <!-- street lamp -->
  <path d="M170 750V300c0-40 30-60 70-60h30" fill="none" stroke="#2B0508" stroke-width="12" stroke-linecap="round"/>
  <path d="M258 234h40l-8 18h-24Z" fill="#2B0508"/>
  <circle cx="278" cy="262" r="10" fill="#FFF3D4"/>
  <path d="M258 262h40l80 488H180Z" fill="#FFF3D4" opacity=".06"/>
</svg>
