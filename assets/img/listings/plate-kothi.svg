<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Double-storey kothi lit up at dusk">
  <defs>
    <linearGradient id="ko-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B0508"/><stop offset=".65" stop-color="#4A070B"/><stop offset="1" stop-color="#8A0D13"/>
    </linearGradient>
    <linearGradient id="ko-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D4"/><stop offset="1" stop-color="#F5C768" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="ko-spill" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#FFF3D4" stop-opacity=".55"/><stop offset="1" stop-color="#FFF3D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#ko-sky)"/>
  <circle cx="500" cy="360" r="330" fill="#ECA72C" opacity=".1"/>

  <!-- roof cabin -->
  <rect x="585" y="240" width="140" height="62" fill="#5A090D"/>
  <rect x="572" y="230" width="166" height="12" fill="#ECA72C"/>
  <rect x="610" y="258" width="44" height="44" fill="url(#ko-win)" opacity=".7"/>

  <!-- first floor -->
  <rect x="270" y="300" width="560" height="22" fill="#B3111A"/>
  <rect x="280" y="322" width="540" height="150" fill="#8A0D13"/>
  <rect x="250" y="462" width="600" height="14" fill="#ECA72C"/>
  <rect x="310" y="350" width="220" height="100" fill="url(#ko-win)"/>
  <path d="M383 350v100M456 350v100" stroke="#8A0D13" stroke-width="5"/>
  <rect x="565" y="350" width="225" height="100" fill="url(#ko-win)" opacity=".85"/>
  <g stroke="#5A090D" stroke-width="8"><path d="M590 346v108M620 346v108M650 346v108M680 346v108M710 346v108M740 346v108M770 346v108"/></g>

  <!-- ground floor -->
  <rect x="220" y="476" width="560" height="146" fill="#5A090D"/>
  <rect x="250" y="500" width="220" height="112" fill="url(#ko-win)"/>
  <path d="M323 500v112M396 500v112" stroke="#5A090D" stroke-width="5"/>
  <rect x="590" y="508" width="62" height="114" fill="#FFF3D4" opacity=".9"/>
  <g fill="#B3111A"><rect x="500" y="476" width="60" height="146"/><rect x="680" y="476" width="100" height="146"/></g>
  <g stroke="#8A0D13" stroke-width="4"><path d="M690 480v138M705 480v138M720 480v138M735 480v138M750 480v138M765 480v138"/></g>

  <!-- down-lights under slabs -->
  <g fill="url(#ko-spill)">
    <path d="M330 476h60l30 80h-120Z"/><path d="M600 476h60l30 80h-120Z"/>
  </g>

  <!-- palms -->
  <g fill="none" stroke="#2B0508" stroke-linecap="round">
    <path d="M140 640c6-120 2-240 26-330" stroke-width="16"/>
    <path d="M870 640c-8-110-4-220-30-300" stroke-width="16"/>
  </g>
  <g fill="#2B0508">
    <path d="M166 310c-50-30-110-20-140 10 40-10 90-8 140-10Z"/><path d="M166 310c40-50 110-60 150-40-50 0-100 18-150 40Z"/>
    <path d="M166 310c-20-60-70-90-120-90 50 20 90 50 120 90Z"/><path d="M166 310c10-60 50-100 100-110-40 30-70 70-100 110Z"/>
    <path d="M166 310c-60 10-100 50-110 100 30-40 70-70 110-100Z"/><path d="M166 310c50 20 90 60 100 110-30-40-60-80-100-110Z"/>
    <path d="M840 340c-50-30-110-20-140 10 40-10 90-8 140-10Z"/><path d="M840 340c40-50 110-60 150-40-50 0-100 18-150 40Z"/>
    <path d="M840 340c-20-60-70-90-120-90 50 20 90 50 120 90Z"/><path d="M840 340c10-60 50-100 100-110-40 30-70 70-100 110Z"/>
    <path d="M840 340c-60 10-100 50-110 100 30-40 70-70 110-100Z"/><path d="M840 340c50 20 90 60 100 110-30-40-60-80-100-110Z"/>
  </g>

  <!-- boundary wall + gate -->
  <rect x="0" y="590" width="440" height="40" fill="#3A060A"/>
  <rect x="620" y="590" width="380" height="40" fill="#3A060A"/>
  <rect x="420" y="556" width="26" height="74" fill="#4A070B"/><rect x="614" y="556" width="26" height="74" fill="#4A070B"/>
  <circle cx="433" cy="548" r="9" fill="#FFF3D4"/><circle cx="627" cy="548" r="9" fill="#FFF3D4"/>
  <circle cx="433" cy="548" r="26" fill="#FFF3D4" opacity=".18"/><circle cx="627" cy="548" r="26" fill="#FFF3D4" opacity=".18"/>
  <g stroke="#ECA72C" stroke-width="3" opacity=".75"><path d="M446 600h168M446 616h168M470 590v40M500 590v40M530 590v40M560 590v40M590 590v40"/></g>

  <rect x="0" y="630" width="1000" height="6" fill="#ECA72C"/>
  <rect x="0" y="636" width="1000" height="114" fill="#2B0508"/>
</svg>
