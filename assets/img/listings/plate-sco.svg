<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="SCO showroom — glass-fronted commercial block">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B0508"/><stop offset=".7" stop-color="#5A090D"/><stop offset="1" stop-color="#8A0D13"/>
    </linearGradient>
    <linearGradient id="sc-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C768" stop-opacity=".55"/><stop offset=".5" stop-color="#B3111A" stop-opacity=".6"/><stop offset="1" stop-color="#ECA72C" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="sc-show" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D4"/><stop offset="1" stop-color="#F5C768" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#sc-sky)"/>
  <circle cx="500" cy="120" r="260" fill="#ECA72C" opacity=".1"/>

  <!-- neighbouring SCOs -->
  <g fill="#3A060A"><rect x="20" y="220" width="280" height="400"/><rect x="700" y="220" width="280" height="400"/></g>
  <g fill="#FFF3D4" opacity=".1">
    <rect x="44" y="270" width="232" height="90"/><rect x="44" y="390" width="232" height="90"/>
    <rect x="724" y="270" width="232" height="90"/><rect x="724" y="390" width="232" height="90"/>
  </g>
  <rect x="44" y="510" width="232" height="110" fill="#FFF3D4" opacity=".2"/>
  <rect x="724" y="510" width="232" height="110" fill="#FFF3D4" opacity=".14"/>

  <!-- the SCO -->
  <rect x="310" y="160" width="380" height="460" fill="#8A0D13"/>
  <rect x="310" y="160" width="380" height="56" fill="#ECA72C"/>
  <rect x="360" y="180" width="280" height="16" rx="8" fill="#4A070B" opacity=".45"/>
  <rect x="336" y="240" width="328" height="220" fill="url(#sc-glass)"/>
  <g stroke="#4A070B" stroke-width="6">
    <path d="M336 350h328M418 240v220M500 240v220M582 240v220"/>
  </g>
  <path d="M350 440l70-190M430 440l60-180" stroke="#FFF3D4" stroke-opacity=".2" stroke-width="10"/>
  <rect x="310" y="470" width="380" height="12" fill="#ECA72C"/>
  <!-- showroom -->
  <rect x="336" y="494" width="328" height="126" fill="url(#sc-show)"/>
  <path d="M500 494v126" stroke="#8A0D13" stroke-width="5"/>
  <g fill="#8A0D13" opacity=".4"><rect x="360" y="560" width="110" height="60"/><rect x="530" y="580" width="110" height="40"/></g>

  <!-- forecourt parking -->
  <rect x="0" y="620" width="1000" height="6" fill="#ECA72C"/>
  <rect x="0" y="626" width="1000" height="124" fill="#2B0508"/>
  <g stroke="#FFF3D4" stroke-opacity=".2" stroke-width="4">
    <path d="M100 650l-40 100M250 650l-30 100M400 650l-20 100M550 650l-10 100M700 650v100M850 650l10 100"/>
  </g>
  <path d="M320 626h360l120 124H200Z" fill="#FFF3D4" opacity=".06"/>
</svg>
